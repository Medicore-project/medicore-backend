# =============================================================================
# MediCore — Prometheus scrape configuration for production (Azure)
# =============================================================================
# Runs on the monitoring VM (medicore-monitoring). deploy.sh ships it to
# /opt/medicore-monitoring/prometheus/prometheus.yml together with the rule
# files from infra/prometheus/rules/ — the same rules the local stack loads.
#
# Job names match infra/prometheus/prometheus.yml exactly, so the alert rules
# and the Grafana dashboard work unchanged. Each job has a single target here
# (no container/host.docker.internal pair), which the `max by (job)` and
# `max without (instance)` expressions handle the same way.
#
# The App Service apps are scraped on their public HTTPS hostnames: App
# Service VNet integration is outbound only, so there is no private inbound
# path to them. Kafka is scraped privately through kafka-exporter on this VM,
# which reaches the broker at 10.20.1.10:9092 over medicore-vnet.
#
# Reload after a change: infra/azure/monitoring-vm/deploy.sh (sends SIGHUP).
# =============================================================================

global:
  # B1 apps answer /metrics in 2–11 s on a cold start; a 10 s timeout marks
  # a slow-but-alive app as down.
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 20s
  external_labels:
    cluster: medicore-azure
    env: production

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus

  - job_name: gateway
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["medicore-gateway.azurewebsites.net"]
        labels:
          service: gateway
          env: production

  - job_name: identity-api
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["medicore-identity.azurewebsites.net"]
        labels:
          service: identity
          env: production

  - job_name: patient-api
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["medicore-patient.azurewebsites.net"]
        labels:
          service: patient
          env: production

  - job_name: appointment-api
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["medicore-appointment.azurewebsites.net"]
        labels:
          service: appointment
          env: production

  - job_name: billing-api
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["medicore-billing.azurewebsites.net"]
        labels:
          service: billing
          env: production

  # Topic offsets, consumer lag and DLT depth from the Kafka VM
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels:
          service: kafka
          env: production
