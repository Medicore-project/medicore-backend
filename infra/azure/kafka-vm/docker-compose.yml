# =============================================================================
# MediCore — production Kafka broker on the Azure VM (medicore-kafka)
#
# Same image and KRaft layout as the local docker-compose.yml, with two
# listeners instead of the host-port one:
#   INTERNAL  kafka:19092             containers on this VM (kafka-init)
#   EXTERNAL  ${KAFKA_ADVERTISED_HOST}:9092
#             the VM's private IP; reached by the App Service apps over
#             VNet integration. The subnet NSG admits 9092 from the
#             App Service integration subnet only.
#
# Lives at /opt/medicore-kafka on the VM; provision.sh writes it there through
# cloud-init together with infra/kafka/create-topics.sh and a .env file.
# =============================================================================
name: medicore-kafka

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: medicore-kafka
    restart: unless-stopped
    environment:
      # KRaft identifiers — single combined broker/controller node
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Listeners
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://${KAFKA_ADVERTISED_HOST:?set KAFKA_ADVERTISED_HOST in .env}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Cluster metadata
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MediCoreAzureKafkaVm00}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created by kafka-init only

      # Retention: 7 days, matching the local broker
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824

      # The VM has 4 GB; leave room for the OS page cache Kafka relies on
      KAFKA_HEAP_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  # Creates the 12 topics once and exits (idempotent) — the same script the
  # local stack runs.
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: medicore-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./create-topics.sh:/scripts/create-topics.sh:ro

volumes:
  kafka-data:
