# =============================================================================
# security-full.yml — MediCore Full-Repo Security Scan
# =============================================================================
# Runs on a daily schedule to catch new CVEs in existing code.
# Also runs manually via workflow_dispatch.
#
# Scans covered:
#   - Gitleaks — full git history secret scan
#   - CodeQL   — C# static analysis (all services)
#   - Trivy    — container image vulnerability scan for all published images
#   - dotnet list --vulnerable — NuGet CVE check for all .csproj files
# =============================================================================

name: Security — Full Scan (Scheduled)

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC daily (07:30 IST)
  workflow_dispatch:        # allow manual trigger for immediate audit
    inputs:
      fail_on_trivy:
        description: "Fail workflow if Trivy finds HIGH/CRITICAL CVEs"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read
  security-events: write
  actions: read
  packages: read

jobs:
  # ---------------------------------------------------------------------------
  # Gitleaks — scan full git history for committed secrets
  # ---------------------------------------------------------------------------
  gitleaks:
    name: Gitleaks — Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # CodeQL — C# static analysis (all services in one pass)
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL — Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-and-quality

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build all services for CodeQL
        run: |
          # Identity (net8.0)
          dotnet restore src/services/identity/MediCore.Identity.Api/Api.csproj
          dotnet build src/services/identity/MediCore.Identity.Api/Api.csproj \
            --configuration Release --no-restore

          # Gateway (net10.0)
          dotnet restore src/gateway/MediCore.Gateway/Gateway.csproj
          dotnet build src/gateway/MediCore.Gateway/Gateway.csproj \
            --configuration Release --no-restore

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp/full-scan"

  # ---------------------------------------------------------------------------
  # NuGet Vulnerability Audit — all .csproj files
  # ---------------------------------------------------------------------------
  nuget-audit:
    name: NuGet Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Audit all projects
        id: audit
        run: |
          FAIL=0
          echo "# NuGet Vulnerability Audit $(date -u '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for csproj in $(find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*"); do
            echo "## $csproj" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY

            dotnet restore "$csproj" --verbosity quiet 2>/dev/null || true
            OUTPUT=$(dotnet list "$csproj" package --vulnerable --include-transitive 2>&1)
            echo "$OUTPUT" | tee -a /tmp/full-nuget-audit.txt
            echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY

            if echo "$OUTPUT" | grep -qiE "(High|Critical)"; then
              echo "::warning::High/Critical vulnerabilities found in $csproj"
              FAIL=1
            fi

            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          done

          if [ $FAIL -eq 1 ]; then
            echo "::error::One or more projects have High/Critical NuGet vulnerabilities."
            exit 1
          fi

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuget-audit-full-${{ github.run_id }}
          path: /tmp/full-nuget-audit.txt
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Trivy — container image vulnerability scan for all GHCR images
  # ---------------------------------------------------------------------------
  trivy-images:
    name: Trivy — Image Scan
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "ghcr.io/${{ github.repository_owner }}/medicore-identity:latest"
            name: "identity"
          - image: "ghcr.io/${{ github.repository_owner }}/medicore-gateway:latest"
            name: "gateway"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR (read-only for scanning)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy scan on ${{ matrix.name }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image }}
          format: "sarif"
          output: "trivy-${{ matrix.name }}.sarif"
          severity: "HIGH,CRITICAL"
          exit-code: ${{ github.event.inputs.fail_on_trivy == 'true' && '1' || '0' }}
        continue-on-error: true

      - name: Upload Trivy SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-scheduled-${{ matrix.name }}

      - name: Upload Trivy artifact (SecOps evidence)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scheduled-${{ matrix.name }}-${{ github.run_id }}
          path: trivy-${{ matrix.name }}.sarif
          retention-days: 90

      - name: Human-readable summary
        if: always()
        run: |
          echo "## Trivy Scan — ${{ matrix.name }} 🔍" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`${{ matrix.image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Severities checked: HIGH, CRITICAL" >> $GITHUB_STEP_SUMMARY
          echo "Results uploaded to GitHub Security → Code Scanning" >> $GITHUB_STEP_SUMMARY
