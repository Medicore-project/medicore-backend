# =============================================================================
# ci-gateway.yml — MediCore API Gateway CI
# =============================================================================
# Triggers ONLY when gateway paths change — proving a gateway change
# never rebuilds Identity (path-filtered independent deployability).
#
# Jobs:
#   1. build-and-test   — restore → build → test
#   2. security-scan    — Gitleaks + CodeQL + NuGet vulnerability audit
#   3. docker-publish   — multi-stage build, push to GHCR
# =============================================================================

name: CI — API Gateway

on:
  push:
    branches: [main, develop]
    paths:
      - "src/gateway/**"
      - ".github/workflows/ci-gateway.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/gateway/**"
      - ".github/workflows/ci-gateway.yml"

env:
  DOTNET_VERSION: "10.0.x"
  IMAGE_NAME: ghcr.io/medicore-project/medicore-gateway

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build & Test
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/gateway/MediCore.Gateway/Gateway.csproj

      - name: Build (Release)
        run: |
          dotnet build src/gateway/MediCore.Gateway/Gateway.csproj \
            --configuration Release \
            --no-restore

      - name: Test
        run: |
          dotnet test src/gateway/MediCore.Gateway/Gateway.csproj \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            --logger "trx;LogFileName=gateway-tests.trx" 2>/dev/null || \
          echo "No tests yet — test project not found (expected for gateway stub)"
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Job 2: Security Scan
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — Secret Scan
        run: docker run -v ${{ github.workspace }}:/path zricethezav/gitleaks:latest detect --source="/path" -v

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-and-quality

      - name: Setup .NET for CodeQL
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build for CodeQL
        run: |
          dotnet restore src/gateway/MediCore.Gateway/Gateway.csproj
          dotnet build src/gateway/MediCore.Gateway/Gateway.csproj \
            --configuration Release --no-restore

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp/gateway"

      - name: NuGet Vulnerability Audit
        run: |
          dotnet restore src/gateway/MediCore.Gateway/Gateway.csproj
          dotnet list src/gateway/MediCore.Gateway/Gateway.csproj package \
            --vulnerable --include-transitive 2>&1 | tee /tmp/nuget-audit-gateway.txt

          echo "## Gateway NuGet Vulnerability Report" >> $GITHUB_STEP_SUMMARY
          cat /tmp/nuget-audit-gateway.txt >> $GITHUB_STEP_SUMMARY

          if grep -qiE "(High|Critical)" /tmp/nuget-audit-gateway.txt; then
            echo "::error::High or Critical NuGet vulnerabilities found."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Job 3: Docker Build & Push to GHCR
  # ---------------------------------------------------------------------------
  docker-publish:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=MediCore API Gateway
            org.opencontainers.image.description=YARP reverse proxy gateway

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: "sarif"
          output: "trivy-gateway.sarif"
          severity: "HIGH,CRITICAL"
          exit-code: "0"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-gateway.sarif
          category: trivy-gateway

      - name: Upload Trivy artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-gateway-${{ github.sha }}
          path: trivy-gateway.sarif
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Job 4: Deploy to Azure App Service
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: docker-publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://medicore-gateway.azurewebsites.net

    steps:
      - name: Deploy container to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_GATEWAY_NAME }}
          publish-profile: ${{ secrets.AZURE_GATEWAY_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Wait for deployment and health check
        run: |
          APP_URL="https://${{ secrets.AZURE_GATEWAY_NAME }}.azurewebsites.net"
          echo "Waiting for $APP_URL to become healthy..."

          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/health/live" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Gateway deployment healthy!"
              break
            fi
            if [ $i -eq 12 ]; then
              echo "::error::Gateway health check failed after 60 seconds"
              exit 1
            fi
            sleep 5
          done

      - name: Deployment summary
        run: |
          echo "## Gateway Deployment Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://${{ secrets.AZURE_GATEWAY_NAME }}.azurewebsites.net |" >> $GITHUB_STEP_SUMMARY
          echo "| Health | https://${{ secrets.AZURE_GATEWAY_NAME }}.azurewebsites.net/health/live |" >> $GITHUB_STEP_SUMMARY
          echo "| Services Health | https://${{ secrets.AZURE_GATEWAY_NAME }}.azurewebsites.net/health/services |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | ${{ env.IMAGE_NAME }}:sha-${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
